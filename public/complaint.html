<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DarKhwast - Complaint detail</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230E6B5C'/><text x='16' y='21' font-size='13' font-family='monospace' text-anchor='middle' fill='white'>DK</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/dashboard-donezo.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="dash-side-backdrop" id="sideBackdrop"></div>
  <div class="dash-layout">
    <aside class="dash-side" id="dashSide">
      <a class="side-brand" href="/dashboard.html"><span class="dk-mark">DK</span> DarKhwast <span class="side-brand-tag">· Dashboard</span></a>
      <div class="side-scroll">
        <div class="side-label">Work</div>
        <nav class="side-nav" aria-label="Main navigation">
          <a class="side-link" href="/dashboard.html" data-nav="dashboard"><span class="nav-label">Dashboard</span></a>
          <a class="side-link" href="/queue.html" data-nav="queue"><span class="nav-label">Complaint Queue</span></a>
          <a class="side-link attention-dot" href="/queue.html?attention=1"><span class="nav-label">Needs attention</span></a>
        </nav>
        <div class="side-label">By status</div>
        <nav class="side-nav" aria-label="Status filters">
          <a class="side-link" href="/queue.html?status=draft"><span class="nav-label">Draft</span></a>
          <a class="side-link" href="/queue.html?status=needs_review"><span class="nav-label">Needs review</span></a>
          <a class="side-link" href="/queue.html?status=sent"><span class="nav-label">Sent</span></a>
          <a class="side-link" href="/queue.html?status=send_failed"><span class="nav-label">Send failed</span></a>
          <a class="side-link" href="/queue.html?status=acknowledged"><span class="nav-label">Acknowledged</span></a>
          <a class="side-link" href="/queue.html?status=in_progress"><span class="nav-label">In progress</span></a>
          <a class="side-link" href="/queue.html?status=resolved"><span class="nav-label">Resolved</span></a>
          <a class="side-link" href="/queue.html?status=rejected"><span class="nav-label">Rejected</span></a>
        </nav>
      </div>
      <div class="side-foot">
        <div class="dz-rail-promo">
          <div class="promo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg></div>
          <div class="promo-title">Citizen portal</div>
          <div class="promo-text">Track a complaint by reference number, no login needed.</div>
          <a class="promo-btn" href="/">Open portal</a>
        </div>
        <button type="button" class="btn js-logout">Sign out</button>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-head">
        <div class="dash-head-inner">
          <div style="display:flex; align-items:center; gap:10px">
            <button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            <a class="wordmark" href="/dashboard.html"><span class="dk-mark">DK</span> DarKhwast <span style="font-weight:400; opacity:.8; font-size:13px">Detail</span></a>
          </div>
          <div style="display:flex; align-items:center; gap:12px">
            <span class="who js-who"></span>
            <button type="button" class="btn js-logout">Sign out</button>
          </div>
        </div>
      </header>

      <main id="main" class="dash-content">
        <a class="dz-back-link" href="/queue.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Back to queue</a>
        <div id="detailRoot">
          <div class="dz-card"><div class="dz-card-body"><div class="sk-line w40"></div><div class="sk-line w80"></div><div class="sk-line"></div><div class="sk-line w60"></div></div></div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/js/complaint.js"></script>
</body>
</html>
