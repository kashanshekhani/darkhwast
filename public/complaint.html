<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DarKhwast - Complaint detail</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230E6B5C'/><text x='16' y='21' font-size='13' font-family='monospace' text-anchor='middle' fill='white'>DK</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="dash-layout">
    <aside class="dash-side">
      <a class="side-brand" href="/dashboard.html"><span class="dk-mark">DK</span> DarKhwast</a>
      <div class="side-label">Complaints</div>
      <nav class="side-nav" aria-label="Complaint filters">
        <a class="side-link" href="/dashboard.html">All complaints</a>
        <a class="side-link" href="/dashboard.html?attention=1">Needs attention</a>
        <a class="side-link" href="/dashboard.html?status=sent">Sent</a>
        <a class="side-link" href="/dashboard.html?status=acknowledged">Acknowledged</a>
        <a class="side-link" href="/dashboard.html?status=in_progress">In progress</a>
        <a class="side-link" href="/dashboard.html?status=resolved">Resolved</a>
      </nav>
      <div class="side-foot">
        <p class="side-note" id="sideNote"></p>
        <button type="button" class="btn js-logout">Sign out</button>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-head">
        <div class="dash-head-inner">
          <a class="wordmark" href="/dashboard.html"><span class="dk-mark">DK</span> DarKhwast <span style="font-weight:400; opacity:.8; font-size:13px">Dashboard</span></a>
          <div style="display:flex; align-items:center; gap:12px">
            <span class="who js-who"></span>
            <button type="button" class="btn js-logout">Sign out</button>
          </div>
        </div>
      </header>

      <main id="main" class="dash-content">
        <a class="back-link" href="/dashboard.html"><span data-icon="back" class="flip-rtl"></span>Back to queue</a>
        <div id="detailRoot">
          <div class="card"><div class="sk-line w40"></div><div class="sk-line w80"></div><div class="sk-line"></div><div class="sk-line w60"></div></div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/js/complaint.js"></script>
</body>
</html>
