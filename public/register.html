<!doctype html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="register_title">Create account - DarKhwast</title>
  <meta name="description" content="Create a DarKhwast citizen account to file complaints, support community issues and track their resolution.">
  <link rel="icon" type="image/png" href="/assets/Logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Naskh+Arabic:wght@400;500;700&family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/community.css">
  <script>try{var l=localStorage.getItem('dk_lang')||'ur';document.documentElement.lang=l;document.documentElement.dir=l==='ur'?'rtl':'ltr';}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">Skip to content</a>

  <main id="main" class="auth-page">
    <div class="auth-brand">
      <a class="wordmark" href="/"><img class="dk-mark" src="/assets/Logo.png" alt="" width="36" height="24"> DarKhwast</a>
    </div>
    <h1 class="auth-title" data-i18n="register_heading">Create your account</h1>
    <p class="auth-sub" data-i18n="register_sub">File complaints, support community issues and track their resolution.</p>

    <div class="banner banner-error" id="authError" role="alert" hidden></div>

    <section class="card auth-card">
      <button type="button" class="btn-google" id="googleBtn" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        <span data-i18n="google_continue">Continue with Google</span>
      </button>
      <div class="auth-divider" id="googleDivider" hidden data-i18n="or_divider">or</div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="name" data-i18n="register_name_l">Full name</label>
          <input id="name" class="control" type="text" autocomplete="name" data-i18n-ph="register_name_ph">
          <div class="field-error" id="nameError" hidden></div>
        </div>
        <div class="field">
          <label for="email" data-i18n="register_email_l">Email</label>
          <input id="email" class="control" type="email" autocomplete="username" placeholder="you@example.com" style="direction:ltr; text-align:start">
          <div class="field-error" id="emailError" hidden></div>
        </div>
        <div class="field">
          <label for="password" data-i18n="register_password_l">Password (at least 8 characters)</label>
          <input id="password" class="control" type="password" autocomplete="new-password" minlength="8" style="direction:ltr; text-align:start">
          <div class="field-error" id="passwordError" hidden></div>
        </div>
        <div class="field">
          <label for="confirm" data-i18n="register_confirm_l">Confirm password</label>
          <input id="confirm" class="control" type="password" autocomplete="new-password" style="direction:ltr; text-align:start">
          <div class="field-error" id="confirmError" hidden></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="registerBtn" data-i18n="register_btn">Create account</button>
      </form>
    </section>

    <p class="auth-alt"><span data-i18n="register_have_account">Already have an account?</span> <a href="/signin.html" data-i18n="register_login_link">Sign in</a></p>
  </main>

  <script type="module" src="/js/register.js"></script>
</body>
</html>
